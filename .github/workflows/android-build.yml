name: Android build

on:
  push:
    branches: ["main", "feature/series-catalog-import", "fix/storage-ascii-series-keys", "fix/2.0.28-series-sync-on-2.0.27", "fix/series-sync-streaming", "fix/resolve-pr11-sync-conflicts"]
  pull_request:
    branches: ["main", "feature/series-catalog-import", "fix/series-sync-streaming"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          assets = Path("app/src/main/assets")
          html = (assets / "index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script\b([^>]*)>(.*?)</script\s*>', html, re.I | re.S)
          count = 0
          for attrs, code in scripts:
              if re.search(r'\bsrc\s*=', attrs, re.I) or not code.strip():
                  continue
              count += 1
              subprocess.run(["node", "--check"], input=code, text=True, check=True)
          for name in ("study.js", "journal.js"):
              path = assets / name
              if path.exists():
                  subprocess.run(["node", "--check", str(path)], check=True)
          print(f"Validated {count} inline JavaScript blocks and external scripts.")
          PY
      - name: Test WebView button interactions
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium
          node scripts/webview-smoke.mjs
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BUTDETAL-series-catalog-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
