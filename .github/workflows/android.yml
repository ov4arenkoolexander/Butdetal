name: Build and publish BUTDETAL APK

on:
  push:
    branches: [main, feature/series-catalog-import, feature/ocr-settings-staging]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare source project from uploaded archive
        shell: bash
        run: |
          set -euo pipefail
          if [ -f source.zip ]; then
            mkdir -p /tmp/butdetal-source
            unzip -q source.zip -d /tmp/butdetal-source
            project_dir="$(find /tmp/butdetal-source -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            test -n "$project_dir"
            rsync -a --exclude='.git' "$project_dir/" ./
          fi
          test -f app/build.gradle
          test -f settings.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate project
        run: python3 tools/verify_project.py

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BUTDETAL-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/feature/series-catalog-import')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare source project from uploaded archive
        shell: bash
        run: |
          set -euo pipefail
          if [ -f source.zip ]; then
            mkdir -p /tmp/butdetal-source
            unzip -q source.zip -d /tmp/butdetal-source
            project_dir="$(find /tmp/butdetal-source -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            test -n "$project_dir"
            rsync -a --exclude='.git' "$project_dir/" ./
          fi
          test -f app/build.gradle
          test -f settings.gradle

      - name: Read app version and verify tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(awk -F"'" '/versionName/ {print $2; exit}' app/build.gradle)"
          test -n "$APP_VERSION"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            test "$APP_VERSION" = "$TAG_VERSION" || { echo "Tag $TAG_VERSION does not match app version $APP_VERSION"; exit 1; }
            TAG_NAME="$GITHUB_REF_NAME"
          else
            TAG_NAME="v$APP_VERSION"
          fi
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BUTDETAL_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BUTDETAL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BUTDETAL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BUTDETAL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing BUTDETAL_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing BUTDETAL_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing BUTDETAL_KEY_ALIAS repository secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing BUTDETAL_KEY_PASSWORD repository secret"; exit 1; }
          KEYSTORE_PATH="$GITHUB_WORKSPACE/butdetal-release.jks"
          python3 - "$KEYSTORE_PATH" <<'PY'
          import os, sys, base64, re
          raw = os.environ["KEYSTORE_BASE64"]
          raw = re.sub(r"-----BEGIN [^-]+-----|-----END [^-]+-----", "", raw)
          raw = re.sub(r"\s+", "", raw)
          try:
              data = base64.b64decode(raw, validate=True)
          except Exception:
              print("Keystore secret is not valid Base64. Recreate BUTDETAL_KEYSTORE_BASE64 from the .jks file.")
              sys.exit(1)
          if not data:
              print("Decoded keystore is empty.")
              sys.exit(1)
          with open(sys.argv[1], "wb") as f:
              f.write(data)
          print("Keystore decoded; file size:", len(data), "bytes")
          PY
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "Keystore cannot be opened. Check the Base64 file and BUTDETAL_KEYSTORE_PASSWORD secret."
            exit 1
          fi
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "Configured alias was not found in the release keystore."
            exit 1
          fi
          export BUTDETAL_KEYSTORE_PATH="$KEYSTORE_PATH"
          export BUTDETAL_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          export BUTDETAL_KEY_ALIAS="$KEY_ALIAS"
          export BUTDETAL_KEY_PASSWORD="$KEY_PASSWORD"
          gradle --no-daemon assembleRelease

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          name: BUTDETAL ${{ steps.version.outputs.app_version }}
          tag_name: ${{ steps.version.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
