name: Build and publish BUTDETAL APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare source project from uploaded archive
        shell: bash
        run: |
          set -euo pipefail
          if [ -f source.zip ]; then
            mkdir -p /tmp/butdetal-source
            unzip -q source.zip -d /tmp/butdetal-source
            project_dir="$(find /tmp/butdetal-source -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            test -n "$project_dir"
            rsync -a --exclude='.git' "$project_dir/" ./
          fi
          test -f app/build.gradle
          test -f settings.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate project
        run: python3 tools/verify_project.py

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BUTDETAL-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare source project from uploaded archive
        shell: bash
        run: |
          set -euo pipefail
          if [ -f source.zip ]; then
            mkdir -p /tmp/butdetal-source
            unzip -q source.zip -d /tmp/butdetal-source
            project_dir="$(find /tmp/butdetal-source -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            test -n "$project_dir"
            rsync -a --exclude='.git' "$project_dir/" ./
          fi
          test -f app/build.gradle
          test -f settings.gradle

      - name: Verify tag matches app version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(awk -F"'" '/versionName/ {print $2; exit}' app/build.gradle)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test -n "$APP_VERSION"
          test "$APP_VERSION" = "$TAG_VERSION" || { echo "Tag $TAG_VERSION does not match app version $APP_VERSION"; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure stable release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BUTDETAL_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing BUTDETAL_KEYSTORE_BASE64 repository secret"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/butdetal-release.jks"
          test -s "$RUNNER_TEMP/butdetal-release.jks"

      - name: Build signed release APK
        env:
          BUTDETAL_KEYSTORE_PATH: ${{ runner.temp }}/butdetal-release.jks
          BUTDETAL_KEYSTORE_PASSWORD: ${{ secrets.BUTDETAL_KEYSTORE_PASSWORD }}
          BUTDETAL_KEY_ALIAS: ${{ secrets.BUTDETAL_KEY_ALIAS }}
          BUTDETAL_KEY_PASSWORD: ${{ secrets.BUTDETAL_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          name: BUTDETAL ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
