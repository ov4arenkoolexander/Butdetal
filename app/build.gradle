plugins { id 'com.android.application' }

android {
    signingConfigs {
        release {
            def ks = System.getenv('BUTDETAL_KEYSTORE_PATH')
            if (ks != null) {
                storeFile file(ks)
                storePassword System.getenv('BUTDETAL_KEYSTORE_PASSWORD')
                keyAlias System.getenv('BUTDETAL_KEY_ALIAS')
                keyPassword System.getenv('BUTDETAL_KEY_PASSWORD')
            }
        }
    }
    namespace 'ua.budivelnyk.ua'
    compileSdk 35
    defaultConfig {
        applicationId 'ua.budivelnyk.ua'
        minSdk 23
        targetSdk 35
        versionCode 46
        versionName '2.0.42'
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.rmtheis:tess-two:9.1.0'
    // Bundled ML Kit text recognition engines: Latin and Cyrillic.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-cyrillic:16.0.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
